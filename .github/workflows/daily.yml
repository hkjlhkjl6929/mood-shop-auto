name: Daily Mood Shop Dashboard Update

on:
  push:
    branches:
      - main
    paths:
      - 'screenshots/**'
      - 'transactions/**'
      - 'build.py'
      - 'template.py'
      - 'requirements.txt'
      - '.github/workflows/daily.yml'
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build dashboards
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          FB_ACCOUNT_ID: ${{ secrets.FB_ACCOUNT_ID }}
          MY_CARD_LAST4: ${{ secrets.MY_CARD_LAST4 }}
          EXCLUDE_CARD_LAST4: ${{ secrets.EXCLUDE_CARD_LAST4 }}
        run: python build.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
